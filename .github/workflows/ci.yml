name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Init CI
        run: yarn run init:ci

      - name: Run lint
        run: yarn run lint:ci

      - name: Run tests
        run: yarn run test:ci

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports
          path: reports

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage/lcov.info
          use_oidc: true

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.20.0
          - 24.12.0
        eslint_profile:
          - name: eslint-9
            eslint: "^9"
            eslint_plugin_eslint_plugin: "^7.0.0"
            eslint_plugin_n: "^18.0.0"
          - name: eslint-10
            eslint: "^10"
            eslint_plugin_eslint_plugin: "^7.0.0"
            eslint_plugin_n: "^18.0.0"
    name: compatibility (${{ matrix.eslint_profile.name }}, node ${{ matrix.node }})

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install ESLint compatibility profile
        run: >
          yarn add --dev --no-lockfile
          "eslint@${{ matrix.eslint_profile.eslint }}"
          "eslint-plugin-eslint-plugin@${{ matrix.eslint_profile.eslint_plugin_eslint_plugin }}"
          "eslint-plugin-n@${{ matrix.eslint_profile.eslint_plugin_n }}"

      - name: Run lint
        run: yarn lint

      - name: Run tests
        run: yarn test
